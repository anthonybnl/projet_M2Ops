[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "la_gazette_des_sorciers"
version = "0.1.0"
description = "Pipeline de gazette matinale automatisée"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2.0", "xmltodict>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # erreurs de style (pycodestyle)
    "F",    # erreurs logiques (imports inutilisés, noms indéfinis)
    "I",    # tri des imports (isort)
    "UP",   # modernisation de la syntaxe (pyupgrade)
    "B",    # pièges courants (bugbear)
]

[tool.ruff.format]
quote-style = "double"

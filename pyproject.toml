[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "la_gazette_des_sorciers"
version = "0.1.0"
description = "Pipeline de gazette matinale automatisée"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-tools"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
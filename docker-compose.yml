services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: la_gazette_des_sorciers
    ports:
      - "5432:5432"

  adminer:
    image: adminer:6.1.2-standalone
    ports:
      - "8080:8080"

  s3:
    image: rustfs/rustfs:1.0.3
    container_name: s3
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs
    ports:
      - "9001:9001"
